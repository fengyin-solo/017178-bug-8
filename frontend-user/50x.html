<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务暂时不可用 - 投标报价计算器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #F8FAFC;
            color: #1E293B;
        }
        .card {
            max-width: 420px;
            width: 100%;
            text-align: center;
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 16px;
            padding: 40px 32px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
        }
        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto;
            border-radius: 50%;
            background: #FEF3C7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        h1 { font-size: 18px; margin: 16px 0 8px; }
        p { font-size: 14px; color: #64748B; line-height: 1.7; }
        .actions { margin-top: 24px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        a, button {
            display: inline-block;
            height: 40px;
            line-height: 40px;
            padding: 0 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            border: 1px solid #E2E8F0;
            background: #FFFFFF;
            color: #64748B;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        a.primary, button { background: #6366F1; color: #fff; border-color: #6366F1; }
        a.primary:hover, button:hover { background: #4F46E5; }
        a.ghost:hover { background: #F1F5F9; }
        .tip { margin-top: 16px; font-size: 12px; color: #94A3B8; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">⚠️</div>
        <h1>服务暂时不可用</h1>
        <p>页面资源加载或服务通信出现了临时问题。<br>您的数据保存在本地浏览器中，请稍后刷新重试。</p>
        <div class="actions">
            <button type="button" onclick="location.reload()">刷新页面</button>
            <a class="ghost" href="/">返回首页</a>
        </div>
        <p class="tip" id="countdown"></p>
    </div>
    <script>
        // 30 秒后自动刷新一次，仍失败则停留在此页（错误页本身不缓存）
        var seconds = 30;
        var el = document.getElementById('countdown');
        var timer = setInterval(function () {
            seconds -= 1;
            if (seconds <= 0) {
                clearInterval(timer);
                location.reload();
            } else {
                el.textContent = seconds + ' 秒后将自动重试…';
            }
        }, 1000);
    </script>
</body>
</html>
