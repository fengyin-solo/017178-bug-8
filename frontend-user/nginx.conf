server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;

    # 隐藏 nginx 版本号
    server_tokens off;

    # 下文的 include snippets/security-headers.conf 为相对路径，
    # 相对 nginx 启动 prefix 解析；官方 nginx:alpine 的 prefix 为 /etc/nginx，
    # 即 /etc/nginx/snippets/security-headers.conf（Dockerfile 已 COPY 至该路径）。

    # ------------------------------------------------------------
    # gzip 压缩
    # ------------------------------------------------------------
    gzip              on;
    gzip_vary         on;        # 输出 Vary: Accept-Encoding，避免代理/缓存把压缩响应错发
    gzip_proxied      any;       # 经过代理的请求也压缩
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml
                      application/json application/javascript
                      application/xml application/xml+rss
                      image/svg+xml application/wasm;
    # 图片/字体等已是压缩格式的类型不在 gzip_types 中，避免二次压缩浪费 CPU。
    # 若构建阶段预生成了 .gz 文件，可直接发送预压缩产物：
    gzip_static       on;

    # ------------------------------------------------------------
    # 自定义错误页（内容可读，避免异常时浏览器显示空白/默认错误页）
    # ------------------------------------------------------------
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        internal;
        include snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /404.html {
        internal;
        include snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # 没有 favicon 时直接返回 204，不污染日志、不触发错误页
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # ------------------------------------------------------------
    # 入口 HTML：协商缓存（no-cache）
    #
    # 不允许浏览器/CDN 直接用旧副本：每次都向服务器校验，
    # 文件未变返回 304（几乎零开销），文件更新后立即拿到新版本。
    # 这是“资源更新后旧版本不残留”的关键一环——
    # 由 HTML 再去引用带指纹的新静态资源地址。
    # ------------------------------------------------------------
    location = /index.html {
        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # ------------------------------------------------------------
    # 带内容指纹的静态资源：长缓存 + immutable
    #
    # 约定：assets/ 目录下的文件名由构建工具注入内容哈希
    # （例如 app.8f3a2b1c.js），文件内容变化时 URL 必然变化，
    # 因此可以安全地缓存一年且不重新校验。
    # 纯手写部署没有构建步骤时，把 css/、js/ 原样发布即可，
    # 它们走下面的非指纹资源规则（协商缓存），不会残留旧版本。
    # ------------------------------------------------------------
    location ^~ /assets/ {
        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ------------------------------------------------------------
    # 非指纹静态资源（css/、js/、图片、字体等）：协商缓存
    #
    # 不再像旧规则那样对未做指纹的 js/css 直接 expires 1y + immutable：
    # 文件名不变的前提下长缓存会让更新后用户长期拿到旧文件。
    # no-cache 表示“使用前必须校验”而非“不缓存”：
    # 命中 ETag/Last-Modified 返回 304，正常访问几乎没有额外流量。
    # ------------------------------------------------------------
    location ~* \.(?:js|css|png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|eot|json|wasm)$ {
        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # ------------------------------------------------------------
    # SPA 入口回退
    #
    # 多级路径（/a/b/c）直接访问或刷新时，文件系统中不存在
    # 对应文件，统一回退到 /index.html 并保持 200，
    # 由前端接管路由，保证所有路径落到同一个页面。
    # 注意：index.html 内的资源引用使用根绝对路径（/css/...），
    # 这样在任意多级路径下都能正确解析，避免白屏。
    # ------------------------------------------------------------
    location / {
        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
