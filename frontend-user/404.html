<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面不存在 - 投标报价计算器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f8fafc;
            color: #334155;
        }
        .card {
            max-width: 420px;
            width: 100%;
            text-align: center;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 40px 28px;
            box-shadow: 0 4px 20px rgba(15, 23, 42, .06);
        }
        .code { font-size: 56px; font-weight: 700; color: #6366f1; line-height: 1; }
        h1 { font-size: 18px; margin: 16px 0 8px; color: #1e293b; }
        p { font-size: 14px; line-height: 1.7; color: #64748b; }
        .actions { margin-top: 24px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        a, button {
            font-size: 14px;
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            background: #fff;
            color: #4f46e5;
            text-decoration: none;
            cursor: pointer;
            font-family: inherit;
        }
        .primary { background: #6366f1; border-color: #6366f1; color: #fff; }
        a:hover, button:hover { opacity: .88; }
    </style>
</head>
<body>
    <div class="card">
        <div class="code">404</div>
        <h1>页面不存在</h1>
        <p>您访问的地址或资源不存在，可能是链接有误或页面版本已更新。</p>
        <div class="actions">
            <a class="primary" href="/">返回首页</a>
            <button type="button" onclick="location.reload()">重新加载</button>
        </div>
    </div>
</body>
</html>
