<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面不存在 - 投标报价计算器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #F8FAFC;
            color: #1E293B;
        }
        .card {
            max-width: 420px;
            width: 100%;
            text-align: center;
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 16px;
            padding: 40px 32px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
        }
        .code {
            font-size: 56px;
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, #6366F1, #8B5CF6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        h1 { font-size: 18px; margin: 16px 0 8px; }
        p { font-size: 14px; color: #64748B; line-height: 1.7; }
        .actions { margin-top: 24px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        a {
            display: inline-block;
            height: 40px;
            line-height: 40px;
            padding: 0 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .primary { background: #6366F1; color: #fff; }
        .primary:hover { background: #4F46E5; }
        .ghost { color: #64748B; border: 1px solid #E2E8F0; }
        .ghost:hover { background: #F1F5F9; }
    </style>
</head>
<body>
    <div class="card">
        <div class="code">404</div>
        <h1>页面不存在</h1>
        <p>您访问的地址可能已被移动或删除。<br>请返回首页重新开始，或刷新页面重试。</p>
        <div class="actions">
            <a class="primary" href="/">返回首页</a>
            <a class="ghost" href="javascript:location.reload()">刷新重试</a>
        </div>
    </div>
</body>
</html>
