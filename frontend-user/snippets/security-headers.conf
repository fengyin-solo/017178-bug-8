# ============================================================
# 安全响应头（公共片段）
#
# 注意：nginx 的 add_header 不会从上层块“追加”继承——
# 一旦某个 location 内出现任何一条 add_header，
# server 级配置的响应头会被整体丢弃。
# 因此所有需要响应头的 location 都显式 include 本片段。
# ============================================================

# 禁止浏览器嗅探响应类型
add_header X-Content-Type-Options "nosniff" always;

# 控制 Referer 泄露，不影响第三方 CDN 资源加载
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 默认关闭敏感浏览器能力，页面为纯计算器，无需这些权限
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# X-Frame-Options 只支持 DENY/SAMEORIGIN，无法表达“允许被指定/任意
# 外部页面内嵌”，且与 CSP frame-ancestors 同时存在时部分浏览器会取
# 更严格值，导致内嵌被拦截。这里改用 CSP frame-ancestors 控制：
#   - 当前为纯前端静态工具，允许任意页面内嵌（*）
#   - 如需收紧，改成具体来源即可，例如：
#     frame-ancestors 'self' https://example.com
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.tailwindcss.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors *; base-uri 'self'; form-action 'self'" always;
